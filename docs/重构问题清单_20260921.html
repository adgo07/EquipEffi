let sortK = 0, sortAsc = true;

function render() {
  const kw = document.getElementById('kw').value.trim().toLowerCase();
  const sv = document.getElementById('sev').value;
  const ly = layerSel.value;
  let rows = ROWS.filter(r => (!sv || r[1]===sv) && (!ly || r[3]===ly) &&
    (!kw || (r[2]+' '+r[3]+' '+r[4]+' '+r[5]+' '+r[6]).toLowerCase().includes(kw)));
  rows.sort((a,b) => {
    let x=a[sortK], y=b[sortK];
    if (sortK===0) { x=+x; y=+y; return sortAsc ? x-y : y-x; }
    return sortAsc ? String(x).localeCompare(String(y),'zh') : String(y).localeCompare(String(x),'zh');
  });
  tbody.innerHTML = rows.map(r =>
    `<tr class="${sevClass[r[1]]||''}">` +
    `<td class="id">${r[0]}</td><td class="sev">${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td>` +
    `<td class="loc">${r[4]}</td><td>${r[5]}</td><td>${r[6]}</td></tr>`
  ).join('');
}
document.querySelectorAll('th').forEach(th => th.addEventListener('click', () => {
  const k = +th.dataset.k; if (k === sortK) sortAsc = !sortAsc; else { sortK = k; sortAsc = true; } render();
}));
document.getElementById('kw').addEventListener('input', render);
document.getElementById('sev').addEventListener('change', render);
layerSel.addEventListener('change', render);
render();
