name: QZC-N01-B Transcendental Numeric Pilot

# 历史 CI 收口（2026-10-02）：
# 原 push 触发指向已合并的历史分支 qzc-n01-b/transcendental-execution，该分支不会再收到
# push，触发器已失效。该 pilot 是一次性历史实证，不重复在 master push 上运行；保留
# pull_request（用于后续受控变更）与 workflow_dispatch 手动重放能力。
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  n01-b:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONPATH: src;.
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[tools]" jsonschema==4.26.0
          New-Item -ItemType Directory -Force artifacts/qzc_n01_b | Out-Null

      - name: Characterize and execute PUMP-RP-0.1 vectors
        id: n01b
        continue-on-error: true
        run: |
          python tools/run_qzc_n01_b_pilot.py 2>&1 | Tee-Object artifacts/qzc_n01_b/reference_runner.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest tests.unit.test_qzc_n01_b_transcendental -v 2>&1 | Tee-Object artifacts/qzc_n01_b/n01b_tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pump numeric contract tests
        id: pumpnumeric
        continue-on-error: true
        run: |
          python -m unittest tests.unit.test_pump_numeric_contract_v2 tests.unit.test_pump_generated_boundaries_v2 tests.unit.test_pump_rule_integrity_v2 -v 2>&1 | Tee-Object artifacts/qzc_n01_b/pump_numeric.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pump water and chemical evaluator tests
        id: evaluators
        continue-on-error: true
        run: |
          python -m unittest tests.unit.test_device_evaluator_matrix tests.unit.test_application_api -v 2>&1 | Tee-Object artifacts/qzc_n01_b/evaluators.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Golden and Phase 1 relevant tests
        id: phase1
        continue-on-error: true
        run: |
          python -m unittest tests.unit.test_pump_golden_case_0_3 tests.unit.test_golden_case_schema_0_2 tests.unit.test_golden_case_0_4_approval tests.contract.test_device_metadata tests.contract.test_architecture_boundaries -v 2>&1 | Tee-Object artifacts/qzc_n01_b/phase1.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile and static checks
        id: static
        continue-on-error: true
        run: |
          python -m compileall -q src tools tests 2>&1 | Tee-Object artifacts/qzc_n01_b/compile.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check 77acc7d31a687dbe43c878b809109afe2bd13ae0...HEAD 2>&1 | Tee-Object artifacts/qzc_n01_b/diff_check.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Full suite baseline
        id: fullsuite
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -t . -v 2>&1 | Tee-Object artifacts/qzc_n01_b/full_suite.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record step outcomes
        if: always()
        run: |
          "n01b=${{ steps.n01b.outcome }}" | Out-File -Encoding utf8 artifacts/qzc_n01_b/step_outcomes.txt
          "pumpnumeric=${{ steps.pumpnumeric.outcome }}" | Out-File -Append -Encoding utf8 artifacts/qzc_n01_b/step_outcomes.txt
          "evaluators=${{ steps.evaluators.outcome }}" | Out-File -Append -Encoding utf8 artifacts/qzc_n01_b/step_outcomes.txt
          "phase1=${{ steps.phase1.outcome }}" | Out-File -Append -Encoding utf8 artifacts/qzc_n01_b/step_outcomes.txt
          "static=${{ steps.static.outcome }}" | Out-File -Append -Encoding utf8 artifacts/qzc_n01_b/step_outcomes.txt
          "fullsuite=${{ steps.fullsuite.outcome }}" | Out-File -Append -Encoding utf8 artifacts/qzc_n01_b/step_outcomes.txt

      - name: Upload N01-B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qzc-n01-b-evidence
          path: artifacts/qzc_n01_b/

      - name: Enforce N01-B targeted gates
        if: always()
        run: |
          $failed = @()
          if ("${{ steps.n01b.outcome }}" -ne "success") { $failed += "n01b" }
          if ("${{ steps.pumpnumeric.outcome }}" -ne "success") { $failed += "pumpnumeric" }
          if ("${{ steps.evaluators.outcome }}" -ne "success") { $failed += "evaluators" }
          if ("${{ steps.phase1.outcome }}" -ne "success") { $failed += "phase1" }
          if ("${{ steps.static.outcome }}" -ne "success") { $failed += "static" }
          if ($failed.Count -gt 0) { throw "Targeted N01-B gates failed: $($failed -join ', ')" }
