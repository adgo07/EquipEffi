name: QZC-N01-B Transcendental Numeric Pilot

on:
  push:
    branches: [qzc-n01-b/transcendental-execution]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  n01-b:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONPATH: src;.
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[tools]" jsonschema==4.26.0

      - name: Characterize and execute PUMP-RP-0.1 vectors
        run: |
          python tools/run_qzc_n01_b_pilot.py
          python -m unittest tests.unit.test_qzc_n01_b_transcendental -v

      - name: Pump numeric contract tests
        run: python -m unittest tests.unit.test_pump_numeric_contract_v2 tests.unit.test_pump_generated_boundaries_v2 tests.unit.test_pump_rule_integrity_v2 -v

      - name: Pump water and chemical evaluator tests
        run: python -m unittest tests.unit.test_device_evaluator_matrix tests.unit.test_application_api -v

      - name: Golden and Phase 1 relevant tests
        run: >-
          python -m unittest
          tests.unit.test_pump_golden_case_0_3
          tests.unit.test_golden_case_schema_0_2
          tests.unit.test_golden_case_0_4_approval
          tests.contract.test_device_metadata
          tests.contract.test_architecture_boundaries -v

      - name: Compile and static checks
        run: |
          python -m compileall -q src tools tests
          git diff --check 77acc7d31a687dbe43c878b809109afe2bd13ae0...HEAD

      - name: Full suite baseline
        id: fullsuite
        continue-on-error: true
        run: python -m unittest discover -s tests -t . -v

      - name: Record full-suite step outcome
        if: always()
        run: |
          New-Item -ItemType Directory -Force artifacts/qzc_n01_b | Out-Null
          "full_suite_step_outcome=${{ steps.fullsuite.outcome }}" | Out-File -Encoding utf8 artifacts/qzc_n01_b/full_suite_outcome.txt

      - name: Upload N01-B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qzc-n01-b-evidence
          path: artifacts/qzc_n01_b/
