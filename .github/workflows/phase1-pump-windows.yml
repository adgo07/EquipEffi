name: Phase 1 pump Windows checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [phase1/pump-v2-r01-r06]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pump-phase1:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[tools]" jsonschema==4.26.0

      - name: Confirm checkout import path
        run: |
          python -c "import equipeffi; print(equipeffi.__file__)"

      - name: Validate schemas, registry pins, and repository evidence
        run: >-
          python tools/validate_phase1_contracts.py
          --negative-probe
          --candidate-jsonl specs/equipment_efficiency/golden/pump_e2e_v0_3_candidates.jsonl
          --candidate-jsonl specs/equipment_efficiency/golden/pump_water_replacement_candidates_v0_1.jsonl
          --approval-review-dir specs/equipment_efficiency/golden/pump_water_approval_review
          --skip-external-evidence

      - name: Pump route, numeric, boundary, and candidate tests
        run: >-
          python -m unittest
          tests.unit.test_application_api
          tests.unit.test_pump_numeric_contract_v2
          tests.unit.test_pump_rule_integrity_v2
          tests.unit.test_pump_generated_boundaries_v2
          tests.unit.test_pump_golden_case_0_3
          tests.unit.test_golden_case_schema_0_2
          tests.unit.test_golden_case_0_4_approval -q

      - name: Metadata and architecture contracts
        run: >-
          python -m unittest
          tests.contract.test_device_metadata
          tests.contract.test_architecture_boundaries -q

      - name: Evaluator matrix
        run: python -m unittest tests.unit.test_device_evaluator_matrix -q

      - name: Compile source and tests
        run: python -m compileall -q src tools tests

      - name: Check P1-G04-R1 diff whitespace
        run: git diff --check 6c672fe48ac3da09b173cb62fd4119daf1c0ab54...HEAD
