name: Numeric Contract v1 Adoption

# 历史 CI 收口（2026-10-02）：
# 原 push 触发指向已合并的历史分支 chore/numeric-contract-v1-adoption，该分支不会再收到
# push，触发器已失效。保留 pull_request 与手动重放能力，并补上 master push，使合并后仍有
# 可核对的证据。
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adoption:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONPATH: src;.
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[tools]" jsonschema==4.26.0

      - name: Adoption lock and profile consistency
        run: |
          New-Item -ItemType Directory -Force artifacts/numeric_v1_adoption | Out-Null
          python -m unittest tests.unit.test_numeric_contract_v1_adoption -v 2>&1 | Tee-Object artifacts/numeric_v1_adoption/adoption.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: N01-B transcendental conformance
        run: |
          python tools/run_qzc_n01_b_pilot.py
          python -m unittest tests.unit.test_qzc_n01_b_transcendental -v 2>&1 | Tee-Object artifacts/numeric_v1_adoption/n01_b.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pump Numeric Contract tests
        run: |
          python -m unittest tests.unit.test_pump_numeric_contract_v2 tests.unit.test_pump_generated_boundaries_v2 tests.unit.test_pump_rule_integrity_v2 -v 2>&1 | Tee-Object artifacts/numeric_v1_adoption/pump_numeric.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pump evaluator and API tests
        run: |
          python -m unittest tests.unit.test_device_evaluator_matrix tests.unit.test_application_api -v 2>&1 | Tee-Object artifacts/numeric_v1_adoption/pump_evaluator.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Golden and relevant Phase tests
        run: |
          python -m unittest tests.unit.test_pump_golden_case_0_3 tests.unit.test_golden_case_schema_0_2 tests.unit.test_golden_case_0_4_approval tests.contract.test_device_metadata tests.contract.test_architecture_boundaries -v 2>&1 | Tee-Object artifacts/numeric_v1_adoption/golden_phase.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile and diff checks
        run: |
          python -m compileall -q src tools tests
          git diff --check 9efc6260b03d9e0a895abdb294a70cda39aa7598...HEAD

      - name: Full suite
        id: fullsuite
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -t . -v 2>&1 | Tee-Object artifacts/numeric_v1_adoption/full_suite.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record outcomes
        if: always()
        run: |
          "full_suite_outcome=${{ steps.fullsuite.outcome }}" | Out-File -Encoding utf8 artifacts/numeric_v1_adoption/outcomes.txt
          "head_sha=${{ github.sha }}" | Add-Content -Encoding utf8 artifacts/numeric_v1_adoption/outcomes.txt
          "central_numeric_sha=ee5feb0cc34dbd99790500fadd0c4c932e202a20" | Add-Content -Encoding utf8 artifacts/numeric_v1_adoption/outcomes.txt

      - name: Upload adoption evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numeric-contract-v1-adoption-evidence
          path: artifacts/numeric_v1_adoption/
