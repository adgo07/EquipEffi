name: Pump Conformance

# 长期 Pump Conformance CI（2026-10-02 建立）
#
# 本 workflow 是 EquipEffi 参考标准 GB 19762—2025 的长期业务门禁，语义与历史任务名解耦：
# 不再以 Phase 1 / N01-B Pilot / Numeric Adoption 作为未来 PR 的主要 CI 身份。
#
# 长期覆盖范围（对应 AGENTS.md 与 REFERENCE_STANDARD_ROADMAP.md）：
#   - Pump Numeric Contract Profile 与 platform-lock 一致性
#   - PUMP-RP-0.1 非线性 / transcendental conformance
#   - generated boundaries
#   - rule integrity
#   - pump_water Approved Golden 0.4 与 schema / 批准门禁
#   - 后续加入 pump_chemical Golden 时在此扩展（占位见文末注释）
#
# M1 去重（2026-10-07）：与 Windows Core **完全重复、且没有额外 conformance 断言**
#   的通用应用门禁（tests.unit.test_device_evaluator_matrix /
#   tests.unit.test_application_api）已从本 workflow 移除——它们仍由 windows-core
#   的唯一一次 full discover 执行并门禁，测试没有消失，只是不再跑两遍。
#   本 workflow 保留其**独立业务价值**：Golden / Numeric Contract / PUMP-RP-0.1
#   参考过程 / 边界与规则完整性 / 历史 provenance / as_of 生命周期 / Stage D /
#   Phase 1 契约证据，以及只有这里才会执行的两个参考工具
#   （tools/run_qzc_n01_b_pilot.py、tools/validate_phase1_contracts.py）。
#
# 全部 job 均为 GATING：任一失败使 workflow FAIL。

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pump-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pump-conformance:
    name: Pump Conformance (gating)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      # 参考执行器 tools/run_qzc_n01_b_pilot.py 以 `from tools.qzc_n01_b_reference import ...`
      # 导入同目录模块，因此仓库根目录也必须在 PYTHONPATH 上（沿用历史 workflow 的 'src;.'）。
      PYTHONPATH: src;.
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
      # 统一分析契约测试不需要 GUI；Qt 相关断言在 windows-core 的 offscreen 任务中运行。
      QT_QPA_PLATFORM: offscreen
    steps:
      # 历史 provenance 门禁需要完整历史：`git show <source_baseline_sha>:<path>`
      # 必须能解析 Golden 记录的历史实现文件。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          # desktop extra 提供 PySide6：本 workflow 会运行
          # tests.unit.test_phase3_r1_blockers，其中包含 Qt offscreen 断言。
          # 缺少该 extra 会导致该模块 import 失败，使 gating 步骤恒红。
          python -m pip install -e ".[tools,desktop]" jsonschema==4.26.0

      - name: Confirm interpreter and import path
        run: |
          python -c "import sys, PySide6; print(sys.version); print('PySide6', PySide6.__version__)"
          python -c "import equipeffi; print(equipeffi.__file__)"

      # Pump Numeric Profile 与 platform-lock.json 的锁定 SHA / profile 声明一致性。
      - name: Numeric Contract v1 adoption lock and profile consistency
        run: python -m unittest tests.unit.test_numeric_contract_v1_adoption -v

      # PUMP-RP-0.1 非线性参考过程：先运行参考执行器，再跑 conformance 测试。
      - name: PUMP-RP-0.1 nonlinear reference procedure
        run: |
          python tools/run_qzc_n01_b_pilot.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest tests.unit.test_qzc_n01_b_transcendental -v

      - name: Pump numeric contract, generated boundaries and rule integrity
        run: |
          python -m unittest `
            tests.unit.test_pump_numeric_contract_v2 `
            tests.unit.test_pump_generated_boundaries_v2 `
            tests.unit.test_pump_rule_integrity_v2 -v

      # pump_water Approved Golden 0.4 + schema + 批准门禁（候选仍为 DRAFT/PENDING）
      # + pump_chemical Approved Golden 0.5 + 统一入口 29/29 回放与生成边界（Phase 3 P3-G04）。
      - name: Approved Golden 0.4/0.5 and unified boundary gates
        run: |
          python -m unittest `
            tests.unit.test_phase2_approved_golden `
            tests.unit.test_pump_golden_case_0_3 `
            tests.unit.test_golden_case_schema_0_2 `
            tests.unit.test_golden_case_0_4_approval `
            tests.unit.test_phase3_golden_and_boundaries `
            tests.unit.test_pump_source_pages -v

      # 契约与来源证据：仓库内结构、registry pins 与负例探针。
      # 外部 GB PDF 字节校验需要额外 evidence root，CI 不提供该文件，故显式跳过并如实报告。
      - name: Phase 1 contract, registry pins and repository evidence
        run: >-
          python tools/validate_phase1_contracts.py
          --negative-probe
          --candidate-jsonl specs/equipment_efficiency/golden/pump_e2e_v0_3_candidates.jsonl
          --candidate-jsonl specs/equipment_efficiency/golden/pump_water_replacement_candidates_v0_1.jsonl
          --approval-review-dir specs/equipment_efficiency/golden/pump_water_approval_review
          --skip-external-evidence

      # Gate 1 历史 provenance（按 source_baseline_sha 校验实现快照）+ Gate 2 当前
      # Golden 回放（由上面 Approved Golden 步骤覆盖）+ Finalize 全状态矩阵
      # + R3 as_of 生命周期规则（评价日期不是标准执行门禁）。
      - name: Historical provenance, Finalize state matrix and as_of lifecycle (gating)
        run: |
          python -m unittest `
            tests.unit.test_phase3_r2_final_closure.GoldenHistoricalProvenanceTests `
            tests.unit.test_phase3_r2_final_closure.FinalizeStateMatrixTests `
            tests.unit.test_phase3_r3_as_of_lifecycle -v

      # Phase 5：pump_chemical Stage D 支持提升候选 —— 11 条历史真值经当前正式
      # Application 链一致复现，且 Golden 的 evaluation_layer 未被改写。
      - name: pump_chemical Stage D support + Phase 6 product shell (gating)
        run: python -m unittest tests.unit.test_phase5_chemical_stage_d.StageDEvidenceTests -v

      # 统一分析业务契约（pump_water 与 pump_chemical 共用正式链路）。
      # M1 去重：通用应用门禁 tests.unit.test_device_evaluator_matrix /
      # tests.unit.test_application_api 已从本步骤移除——它们与 windows-core
      # 完全重复，仍由 windows-core 的唯一一次 full discover 执行并门禁。
      # test_phase3_r1_blockers 为 R1 对抗性门禁：Finalize 状态白名单 fail-closed、
      # Qt stale result、Canonical pack_hash、技术详情折叠。
      - name: Unified analysis contract and R1 adversarial gates (gating)
        run: |
          python -m unittest `
            tests.unit.test_phase3_unified_analysis `
            tests.unit.test_phase3_r3_closure `
            tests.unit.test_phase3_r1_blockers -v

# pump_chemical 扩展占位（Phase 5 接入后在此追加）：
#   - pump_chemical Golden 具名批准后的批准门禁测试
#   - pump_chemical Conformance 向量测试
# 在 pump_chemical 的 support_status 由 NOT_IN_RELEASE_SCOPE 切换为 SUPPORTED 之前，
# 不得因为本 workflow 绿灯而宣称 pump_chemical 已正式支持。
