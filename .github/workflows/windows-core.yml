name: Windows Core

# 长期 Windows Core CI（2026-10-02 建立）
#
# 本 workflow 是 EquipEffi 面向所有 PR 的长期 Windows 门禁，语义与历史任务名解耦：
# 不再以 Phase 1 / N01-B Pilot / Numeric Adoption 作为未来 PR 的主要 CI 身份。
#
# GATING JOBS（失败会使 workflow FAIL）：
#   - windows-core      : Windows Core (gating)
#   - whitespace-check  : Whitespace check (gating)
#
# NON-GATING JOB（失败不会使 workflow FAIL）：
#   - full-suite-baseline : "Full suite baseline (NON-GATING BASELINE / KNOWN BASELINE)"
#     设 continue-on-error: true，仅用于保存并展示真实 run / failure / error / skipped。
#     仓库当前存在已知失败，**workflow green 不得被解释为 "Full suite PASS"**。
# windows-core 内的按 ID 回归比较器为 GATING；未知失败/错误/跳过会使其失败。

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-core:
    name: Windows Core (gating)
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[tools,desktop]" jsonschema==4.26.0

      - name: Confirm interpreter and import path
        run: |
          python -c "import sys, PySide6; print(sys.executable); print(sys.version); print('PySide6', PySide6.__version__); assert sys.version_info[:2] == (3, 12)"
          python -c "import equipeffi; print(equipeffi.__file__)"

      - name: Compileall
        run: python -m compileall -q src tools tests

      - name: Architecture boundaries and metadata contract
        run: |
          python -m unittest `
            tests.contract.test_architecture_boundaries `
            tests.contract.test_device_metadata -q

      - name: Application and core tests
        run: |
          python -m unittest `
            tests.unit.test_application_api `
            tests.unit.test_evaluation_engine `
            tests.unit.test_entrypoint `
            tests.unit.test_public_device_types `
            tests.unit.test_device_evaluator_matrix -q

      # module is identifiable from the step outcome alone (no log access).
      - name: Phase 2/3/4/5/6 settings, lifecycle, Stage D, Product Shell, Qt offscreen (gating)
        shell: pwsh
        run: |
          $mods = @(
            'tests.unit.test_composition',
            'tests.unit.test_phase2_settings',
            'tests.unit.test_phase2_logging',
            'tests.unit.test_phase2_qt',
            'tests.unit.test_phase3_qt_unified',
            'tests.unit.test_phase3_r1_blockers',
            'tests.unit.test_phase3_r2_final_closure',
            'tests.unit.test_phase3_r3_as_of_lifecycle',
            'tests.unit.test_phase4_lifecycle_generalization',
            'tests.unit.test_phase4_fingerprint_decoupling',
            'tests.unit.test_phase5_chemical_stage_d',
            'tests.unit.test_phase6_product_shell',
            'tests.unit.test_windows_regression_comparator'
          )
          $log = 'gating.txt'
          python -m unittest @mods -v *> $log
          $code = $LASTEXITCODE
          Write-Output "EXITCODE=$code"
          Select-String -Path $log -Pattern 'FAIL:|ERROR:|^Ran |^OK|^FAILED|Traceback' | ForEach-Object { Write-Output $_.Line }
          Get-Content $log -Tail 60 | ForEach-Object { Write-Output $_ }
          exit $code
      - name: Full suite known-regression comparator (gating)
        run: python tools/check_windows_regressions.py --output artifacts/phase2-regression

      - name: Upload exact regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-regression-evidence
          path: artifacts/phase2-regression/

      - name: Package and resource smoke
        run: |
          python -m equipeffi --status
          python -m equipeffi --list-device-types

  full-suite-baseline:
    name: Full suite baseline (NON-GATING BASELINE / KNOWN BASELINE)
    runs-on: windows-latest
    timeout-minutes: 45
    continue-on-error: true
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
    steps:
      # 完整历史：历史 provenance 门禁需要 `git show <source_baseline_sha>:<path>`。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[tools,desktop]" jsonschema==4.26.0

      # continue-on-error 只用于保留真实基线证据；本 job 的名称已显式标注 NON-GATING，
      # 不得据此把 workflow green 解释为 "Full suite PASS"。
      #
      # 注意：Python unittest 的 "Ran ... / OK / FAILED" 摘要通常写到 **stderr**，
      # 因此这里必须合并 stdout + stderr 后再提取，否则会保存了真实失败却显示不出数字。
      - name: Run full unittest suite and record real counts
        run: |
          New-Item -ItemType Directory -Force artifacts/full-suite-baseline | Out-Null
          $p = Start-Process -FilePath python `
            -ArgumentList @('-m','unittest','discover','-s','tests','-t','.','-v') `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput artifacts/full-suite-baseline/full_suite.log `
            -RedirectStandardError artifacts/full-suite-baseline/full_suite.err
          $code = $p.ExitCode

          $stdout = if (Test-Path artifacts/full-suite-baseline/full_suite.log) { Get-Content artifacts/full-suite-baseline/full_suite.log -Raw } else { "" }
          $stderr = if (Test-Path artifacts/full-suite-baseline/full_suite.err) { Get-Content artifacts/full-suite-baseline/full_suite.err -Raw } else { "" }
          $merged = $stdout + "`n" + $stderr
          $merged | Out-File -Encoding utf8 artifacts/full-suite-baseline/full_suite_merged.log

          $summary = ($merged -split "`n" | Where-Object { $_ -match '^Ran |^OK|^FAILED' })
          $failed = ($merged -split "`n" | Where-Object { $_ -match '^(ERROR|FAIL): ' })

          Write-Output "===== FULL SUITE (NON-GATING / KNOWN BASELINE) ====="
          Write-Output "exit_code=$code"
          if ($summary) { $summary | ForEach-Object { Write-Output $_.Trim() } } else { Write-Output "WARNING: 未在合并输出中找到 Ran/OK/FAILED 摘要" }
          if ($failed) {
            Write-Output "----- known failures / errors -----"
            $failed | ForEach-Object { Write-Output $_.Trim() }
          }

          @(
            "job=full-suite-baseline",
            "gating=false",
            "exit_code=$code",
            "head_sha=${{ github.sha }}",
            "--- summary (stdout+stderr merged) ---"
          ) + $summary + @("--- failures/errors ---") + $failed |
            Out-File -Encoding utf8 artifacts/full-suite-baseline/outcome.txt
          if ($code -ne 0) { Write-Output "KNOWN BASELINE FAILURES PRESERVED (non-gating)" }

      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-suite-baseline-evidence
          path: artifacts/full-suite-baseline/

  whitespace-check:
    name: Whitespace check (gating)
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 动态比较：不使用任何历史业务 SHA 作为永久门禁。
      - name: Determine comparison base
        id: base
        run: |
          $eventName = "${{ github.event_name }}"
          $b = ""
          if ($eventName -eq "pull_request") {
            $b = "${{ github.event.pull_request.base.sha }}"
          } elseif ($eventName -eq "push") {
            $b = "${{ github.event.before }}"
          }
          if ([string]::IsNullOrWhiteSpace($b) -or $b -match '^0+$') {
            $b = "HEAD~1"
          }
          git cat-file -e "$b^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) { $b = "HEAD~1" }
          Write-Output "base=$b"
          "base=$b" | Out-File -Encoding utf8 -Append $env:GITHUB_OUTPUT

      - name: git diff --check against dynamic base
        run: |
          $b = "${{ steps.base.outputs.base }}"
          Write-Output "checking whitespace: $b..HEAD"
          git diff --check "$b...HEAD"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
