name: Windows Core

# 长期 Windows Core CI（2026-10-02 建立；2026-10-07 M1 单人维护简化：CI 纯去重）
#
# 本 workflow 是 EquipEffi 面向所有 PR 的长期 Windows 门禁，语义与历史任务名解耦：
# 不再以 Phase 1 / N01-B Pilot / Numeric Adoption 作为未来 PR 的主要 CI 身份。
#
# GATING JOBS（失败会使 workflow FAIL）：
#   - windows-core      : Windows Core (gating)
#   - whitespace-check  : Whitespace check (gating)
#
# M1 去重原则：**同一次 PR CI 中，同一个测试只执行一次**。
#   1. `tests.contract.*` 不被 `unittest discover` 覆盖（tests/contract 无 __init__.py），
#      因此保留唯一一次显式执行步骤——这不是重复，删除它会丢失门禁；
#   2. 其余全部测试由**唯一一次** full discover 执行并落盘（--mode run）；
#   3. known-regression 比较步骤只读取该结果（--mode compare），不再重新 discover；
#   4. 原 `full-suite-baseline` job 与上述 full discover 完全相同，已删除；
#      其「真实计数证据」由 full_suite.log / summary.txt / actual.json 承担并照常上传。
#
# 真实结果口径（不得弱化）：
#   - 仓库当前仍存在已知 baseline failures（见 tests/baselines/windows_full_suite_known.json）。
#     **workflow green 只表示「没有新增回归」，绝不等于「全量测试全部通过」。**
#   - known regression 仍按**精确测试 ID + 类型**比较；unknown failure / error /
#     新增 skip / failure→error 恶化 / 基线测试缺失，一律使 gate FAIL。

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-core:
    name: Windows Core (gating)
    runs-on: windows-latest
    # Phase 8 R1W 起 gating 包含 100/1000/10000 行批量回归与结构守卫。
    # 这里只为现有门禁提供足够时间，**不删除测试、不减少门禁、不新增 skip**。
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[tools,desktop]" jsonschema==4.26.0

      - name: Confirm interpreter and import path
        run: |
          python -c "import sys, PySide6; print(sys.executable); print(sys.version); print('PySide6', PySide6.__version__); assert sys.version_info[:2] == (3, 12)"
          python -c "import equipeffi; print(equipeffi.__file__)"

      - name: Compileall
        run: python -m compileall -q src tools tests

      # 架构边界 + 元数据契约。保留独立步骤：`unittest discover` 不进入
      # tests/contract（该目录无 __init__.py），这是这些测试**唯一**的执行点。
      - name: Architecture boundaries and metadata contract (gating)
        run: |
          python -m unittest `
            tests.contract.test_architecture_boundaries `
            tests.contract.test_device_metadata -v

      # 本 job 内唯一一次 full discover：执行并落盘真实结果。
      # 该步骤绿灯仅代表「套件执行完成」，真实 fail/error/skip 见 summary.txt。
      - name: Full suite (single execution, record real results)
        run: python tools/check_windows_regressions.py --mode run --output artifacts/phase2-regression

      # 只读取上一步已落盘的结果做按 ID 比较，不重新执行任何测试。
      - name: Known-regression comparator by exact test id (gating)
        run: python tools/check_windows_regressions.py --mode compare --output artifacts/phase2-regression

      - name: Upload exact regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-regression-evidence
          path: artifacts/phase2-regression/

      - name: Package and resource smoke
        run: |
          python -m equipeffi --status
          python -m equipeffi --list-device-types

  whitespace-check:
    name: Whitespace check (gating)
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 动态比较：不使用任何历史业务 SHA 作为永久门禁。
      - name: Determine comparison base
        id: base
        run: |
          $eventName = "${{ github.event_name }}"
          $b = ""
          if ($eventName -eq "pull_request") {
            $b = "${{ github.event.pull_request.base.sha }}"
          } elseif ($eventName -eq "push") {
            $b = "${{ github.event.before }}"
          }
          if ([string]::IsNullOrWhiteSpace($b) -or $b -match '^0+$') {
            $b = "HEAD~1"
          }
          git cat-file -e "$b^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) { $b = "HEAD~1" }
          Write-Output "base=$b"
          "base=$b" | Out-File -Encoding utf8 -Append $env:GITHUB_OUTPUT

      - name: git diff --check against dynamic base
        run: |
          $b = "${{ steps.base.outputs.base }}"
          Write-Output "checking whitespace: $b..HEAD"
          git diff --check "$b...HEAD"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
