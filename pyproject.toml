[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "equipeffi"
version = "0.2.1"
description = "设备能效分析工具"
requires-python = ">=3.12,<3.13"
# 判定核心和标准资源使用Python标准库；桌面界面依赖由可选desktop组提供。
dependencies = []

[project.scripts]
equipeffi = "equipeffi.entrypoint:main"

[project.optional-dependencies]
desktop = ["PySide6>=6.8,<7"]
tools = ["openpyxl>=3.1", "python-docx>=1.1"]
test = ["pytest>=8", "jsonschema==4.26.0"]

[tool.setuptools]
# Only files declared below are runtime data. VCS-discovered package files must
# not silently expand the installed application payload.
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
equipeffi = [
    "standard_manifest.json",
    "resources/TEMPLATE_MANIFEST.json",
    "resources/elimination_catalog_batches_1_4.json",
    "resources/elimination_catalog_industry_2024.json",
    "resources/standards/*.json",
    "resources/templates/设备能效分析空白模板_重构版V6_20261005.xlsx",
    "resources/templates/设备能效分析空白模板_重构版V6_1.xlsx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
