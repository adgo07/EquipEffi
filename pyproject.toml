[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "equipeffi"
version = "0.2.1"
description = "设备能效分析工具"
requires-python = ">=3.12,<3.13"
# 判定内核、公共API及OOXML适配器只使用Python标准库；将文档/表格
# 生成工具依赖放入可选组，便于Linux服务和安卓桥接层安装轻量核心包。
dependencies = []

[project.scripts]
equipeffi = "equipeffi.entrypoint:main"

[project.optional-dependencies]
desktop = ["tkinterdnd2>=0.4", "PySide6>=6.8,<7"]
tools = ["openpyxl>=3.1", "python-docx>=1.1"]
test = ["pytest>=8"]

[tool.setuptools]
# Only files declared below are runtime data. VCS-discovered package files must
# not silently expand the installed application payload.
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
equipeffi = [
    "standard_manifest.json",
    "resources/elimination_catalog_batches_1_4.json",
    "resources/elimination_catalog_industry_2024.json",
    "resources/standards/*.json",
    "resources/templates/设备能效分析空白模板_重构版V4_20260825.xlsx",
    "resources/templates/设备能效分析空白模板_重构版V6_20261005.xlsx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
