[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "equipeffi"
version = "0.2.1"
description = "设备能效分析工具"
requires-python = ">=3.12,<3.13"
# 判定内核、公共API及OOXML适配器只使用Python标准库；将文档/表格
# 生成工具依赖放入可选组，便于Linux服务和安卓桥接层安装轻量核心包。
dependencies = []

[project.scripts]
equipeffi = "equipeffi.entrypoint:main"

[project.optional-dependencies]
desktop = ["tkinterdnd2>=0.4"]
tools = ["openpyxl>=3.1", "python-docx>=1.1"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
equipeffi = [
    "standard_manifest.json",
    "resources/*.json",
    "resources/standards/*.json",
    "resources/templates/*.xlsx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
